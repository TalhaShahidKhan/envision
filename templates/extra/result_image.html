{% if error %}
    <div class="bg-red-50 dark:bg-red-900/20 border-l-4 border-red-500 text-red-800 dark:text-red-300 p-6 rounded-2xl mb-8 shadow-sm animate-fade-in flex items-start space-x-4">
        <div class="shrink-0 bg-red-100 dark:bg-red-900/40 rounded-xl p-3 text-red-600 dark:text-red-400">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>
        <div class="flex-1 pt-1">
            <h3 class="text-base font-extrabold uppercase tracking-widest mb-1">Neural Task Failed</h3>
            <p class="text-sm opacity-90 leading-relaxed">{{ error }}</p>
        </div>
    </div>
{% elif url %}
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 border border-gray-200 dark:border-gray-700 animate-fade-in">
        <div class="flex items-center justify-center mb-4">
            <div class="w-full max-w-xs bg-linear-to-r from-blue-600 to-purple-600 rounded-full h-1"></div>
            <h2 class="text-xl font-bold mx-4 text-gray-800 dark:text-white whitespace-nowrap">{{ task_name }}</h2>
            <div class="w-full max-w-xs bg-linear-to-r from-purple-600 to-blue-600 rounded-full h-1"></div>
        </div>
        <div class="relative group mb-6">
            <div class="absolute inset-0 bg-linear-to-r from-blue-600/20 to-purple-600/20 rounded-xl blur-xl opacity-70 group-hover:opacity-100 transition-opacity duration-300">
            </div>
            <div class="relative flex justify-center">
                <img src="{{ url }}"
                     height="500"
                     width="500"
                     alt="{{ original_image.image_name }}"
                     id="resultImage"
                     class="max-w-full max-h-[500px] rounded-xl shadow-lg object-contain bg-gray-50 dark:bg-gray-900 p-1">
            </div>
        </div>
        <div class="flex justify-center gap-4">
            <button onclick="downloadImage('{{ url }}', 'Envision_{{ task_name|slugify }}_{{ original_image.image_name|slugify }}')"
                    class="group relative inline-flex items-center justify-center px-8 py-4 font-bold text-white transition-all duration-300 bg-linear-to-r from-blue-600 to-indigo-600 rounded-2xl hover:from-blue-700 hover:to-indigo-700 shadow-xl hover:shadow-blue-500/25 active:scale-95 overflow-hidden">
                <div class="absolute inset-0 w-full h-full transition duration-300 group-hover:bg-white/10"></div>
                <svg xmlns="http://www.w3.org/2000/svg"
                     class="h-6 w-6 mr-3 animate-bounce-subtle"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                <span class="relative">Download High-Res</span>
            </button>
        </div>
    </div>
    <!-- Download Logic -->
    <script>
        async function downloadImage(imageSrc, name) {
            try {
                const image = await fetch(imageSrc);
                const imageBlog = await image.blob();
                const imageURL = URL.createObjectURL(imageBlog);

                const link = document.createElement('a');
                link.href = imageURL;
                link.download = name || 'envision-processed-image';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(imageURL);
            } catch (err) {
                console.error("Download failed:", err);
                window.open(imageSrc, '_blank'); // Fallback to new tab
            }
        }
    </script>
{% else %}
    <div class="bg-yellow-50 dark:bg-yellow-900/30 text-yellow-800 dark:text-yellow-200 p-6 rounded-xl animate-fade-in">
        <div class="flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg"
                 class="h-6 w-6 mr-2"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <p>No image result available.</p>
        </div>
    </div>
{% endif %}
<style>
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes bounceSubtle {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
.animate-fade-in {
  animation: fadeIn 0.5s ease-out forwards;
}
.animate-bounce-subtle {
  animation: bounceSubtle 2s infinite ease-in-out;
}
</style>
